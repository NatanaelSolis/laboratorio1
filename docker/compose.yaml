name: laboratorio2

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: laboratorio1
      POSTGRES_USER: laboratorio_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LaboratorioLocal123}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - productos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboratorio_app -d laboratorio1"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_app
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-KeycloakLocal123}
    volumes:
      - usuarios_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_app -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    entrypoint: ["/bin/bash", "/opt/keycloak/start.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-KeycloakLocal123}
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./keycloak/laboratorio1-realm.json:/opt/keycloak/data/import/laboratorio1.json:ro
      - ./keycloak/start.sh:/opt/keycloak/start.sh:ro

volumes:
  productos_pg:
  usuarios_pg:
