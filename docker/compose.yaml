name: laboratorio1

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    entrypoint: [ "/bin/bash", "/opt/keycloak/start.sh" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL: "jdbc:mysql://db:3306/keycloak"
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: "KeycloakDb123!"
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      - db
    volumes:
      - ./keycloak/laboratorio1-realm.json:/opt/keycloak/data/import/laboratorio1-realm.json:ro
      - ./keycloak/start.sh:/opt/keycloak/start.sh:ro

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "ArbolPerroManzana3"
      MYSQL_DATABASE: laboratorio1
      MYSQL_USER: laboratorio_app
      MYSQL_PASSWORD: "ArbolPerroManzana3"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
